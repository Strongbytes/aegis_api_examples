[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-api-examples"
version = "0.1.0"
description = "Examples of calling the Aegis API from Python."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.2",
]

[dependency-groups]
test = [
    "pytest>=9.1",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.8",
]
dev = [
    { include-group = "test" },
    "mypy>=2.3",
    "ruff==0.16.9",
]

[tool.setuptools]
py-modules = ["constants", "aegis_types"]
packages = ["utils"]

[tool.pytest]
testpaths = ["test_examples"]
addopts = ["-n", "auto", "-rP"]
timeout = "600"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PT", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["."]
