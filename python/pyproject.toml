[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-api-examples"
version = "0.1.0"
description = "Examples of calling the Aegis API from Python."
requires-python = ">=3.10"
dependencies = [
    "pytest>=9.1",
    "pytest-xdist>=3.8",
    "python-dotenv>=1.2",
    "requests>=2.34",
]

[tool.setuptools]
py-modules = ["constants", "aegis_types"]
packages = ["utils"]
